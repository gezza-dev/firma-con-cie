name: Linux packages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Linux ${{ matrix.architecture }} / ${{ matrix.format }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
        format: [deb, appimage]
        include:
          - architecture: x64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the isolated native build image
        env:
          CIE_LINUX_FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          if [ "$CIE_LINUX_FORMAT" = appimage ]; then
            docker build -t firma-cie-appimage-base -f linux/appimage/Dockerfile .
          fi
          docker build -t firma-cie-linux-ci -f "linux/ci/Dockerfile.$CIE_LINUX_FORMAT" .
          mkdir -p reports
          docker image inspect firma-cie-linux-ci > reports/linux-ci-image.json
      - name: Build, test and package without host devices or profiles
        env:
          CIE_LINUX_FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          # The namespace permissions are used only for synthetic HTTPS trust
          # tests inside this disposable container; no host home, USB or PC/SC
          # socket is mounted. Compilation runs as the checkout's ordinary user.
          docker run --rm --user "$(id -u):$(id -g)" \
            --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --env HOME=/tmp/firma-cie-ci-home --env PUB_CACHE=/tmp/firma-cie-ci-pub-cache \
            --env CIE_LINUX_FORMAT --env GITHUB_PATH=/tmp/firma-cie-github-path \
            --volume "$GITHUB_WORKSPACE:/work/project" --workdir /work/project \
            firma-cie-linux-ci bash -euo pipefail -c '
              mkdir -p "$HOME"
              python3 scripts/check_repository.py --report "reports/linux-source-audit.json"
              python3 scripts/ci_desktop_common.py --install-flutter /tmp/firma-cie-flutter
              export PATH="/tmp/firma-cie-flutter/bin:$PATH"
              python3 scripts/ci_linux.py "$CIE_LINUX_FORMAT"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: firma-con-cie-linux-${{ matrix.architecture }}-${{ matrix.format }}-${{ github.sha }}
          path: |
            dist/linux-${{ matrix.architecture }}-${{ matrix.format }}/*.deb
            dist/linux-${{ matrix.architecture }}-${{ matrix.format }}/*.AppImage
            dist/linux-${{ matrix.architecture }}-${{ matrix.format }}/*.tar.gz
            dist/linux-${{ matrix.architecture }}-${{ matrix.format }}/SHA256SUMS
            dist/linux-${{ matrix.architecture }}-${{ matrix.format }}/package-manifest.json
            dist/linux-${{ matrix.architecture }}-${{ matrix.format }}/LEGGIMI.md
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.architecture }}-${{ matrix.format }}-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports
            .build/dependencies/linux-*/logs
          if-no-files-found: ignore
          retention-days: 14
