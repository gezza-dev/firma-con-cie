name: macOS Universal package

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      MACOS_CERTIFICATE_P12_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      MACOS_TEAM_ID:
        required: false
      MACOS_NOTARY_KEY_P8_BASE64:
        required: false
      MACOS_NOTARY_KEY_ID:
        required: false
      MACOS_NOTARY_ISSUER_ID:
        required: false
      MACOS_NOTARY_APPLE_ID:
        required: false
      MACOS_NOTARY_PASSWORD:
        required: false

permissions:
  contents: write

concurrency:
  group: macos-universal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_draft:
    uses: ./.github/workflows/release-draft.yml
    with:
      phase: prepare
  package:
    needs: prepare_draft
    runs-on: macos-26
    timeout-minutes: 180
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
      MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      PUB_CACHE: /private/tmp/firma-cie-tools/pub-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Check required signing configuration before compiling
        run: python3 scripts/ci_macos.py check-secrets
      - name: Verify Developer ID import and notarization credentials before compiling
        run: python3 scripts/ci_macos.py check-credentials
      - name: Use a neutral source and tool directory
        run: |
          set -euo pipefail
          git clone --no-hardlinks "$GITHUB_WORKSPACE" /private/tmp/firma-cie-source
          echo 'CIE_CI_SOURCE=/private/tmp/firma-cie-source' >> "$GITHUB_ENV"
          brew install cmake ninja pkg-config autoconf automake libtool
          python3 -m venv /private/tmp/firma-cie-tools
          /private/tmp/firma-cie-tools/bin/pip install meson==1.11.0 ds_store==1.3.1
          echo '/private/tmp/firma-cie-tools/bin' >> "$GITHUB_PATH"
      - name: Install the pinned Flutter SDK
        working-directory: ${{ env.CIE_CI_SOURCE }}
        run: python3 scripts/ci_desktop_common.py --install-flutter /private/tmp/firma-cie-flutter
      - name: Build Universal middleware, app and CTK; sign and notarize
        working-directory: ${{ env.CIE_CI_SOURCE }}
        run: |
          set -euo pipefail
          python3 scripts/check_repository.py --report reports/macos/source-audit.json
          python3 scripts/test_desktop_ci.py
          python3 scripts/test_macos_signing.py
          python3 scripts/ci_macos.py build
      - name: Remove this job's temporary signing credentials
        if: always()
        run: python3 scripts/ci_macos.py cleanup
      - name: Upload verified packages to the unpublished version draft
        working-directory: ${{ env.CIE_CI_SOURCE }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_release.py upload --target macos-universal --receipt reports/macos/result.json
      - name: Keep diagnostics in a private CI staging draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_release.py diagnostics --name macos-universal /private/tmp/firma-cie-source/reports/macos
  draft_metadata:
    if: ${{ always() && !cancelled() && needs.prepare_draft.result == 'success' && github.workflow == 'macOS Universal package' }}
    needs: [prepare_draft, package]
    uses: ./.github/workflows/release-draft.yml
