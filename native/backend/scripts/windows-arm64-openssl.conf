# OpenSSL 3.5.9 has mingw/mingw64 but no GNU-ABI Windows ARM64 target.
# Inherit its Windows policy without x86 -m64/resource/assembler settings.
# The build recipe additionally requires no-asm, no-shared and no-module.
my %targets = (
    "cie-mingw-arm64" => {
        inherit_from => [ "mingw-common" ],
        sys_id => "MINGW64",
        bn_ops => add("SIXTY_FOUR_BIT"),
        asm_arch => "aarch64",
        uplink_arch => undef,
        shared_rcflag => "",
        multilib => "64",
    },
);
